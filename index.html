<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetInfra Manager v5.4</title>
    <style>
        :root {
            --bg: #f4f6f9; --panel: #fff; --border: #ddd; --primary: #2c3e50;
            --accent: #3498db; --danger: #e74c3c; --success: #27ae60; --warning: #f39c12;
            --nested-bg: #f8fafc; --stack-bg: #f0f4ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #333; }

        #loginScreen { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 380px; text-align: center; }
        .login-box h2 { color: var(--primary); margin-bottom: 1.5rem; }
        .login-box .logo { font-size: 2rem; margin-bottom: 0.5rem; }
        .login-box input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
        .login-box button { width: 100%; padding: 0.8rem; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .login-box .error { color: var(--danger); margin-top: 0.5rem; font-size: 0.9rem; }

        #appScreen { display: none; flex-direction: column; height: 100vh; }
        nav.tabs { background: var(--primary); display: flex; align-items: center; padding: 0 1rem; flex-shrink: 0; }
        nav.tabs button { background: none; border: none; color: #ecf0f1; padding: 1rem 1.2rem; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; border-bottom: 3px solid transparent; }
        nav.tabs button.active { background: rgba(255,255,255,0.15); border-bottom-color: var(--accent); color: white; }
        nav.tabs button:hover { background: rgba(255,255,255,0.1); }
        nav.tabs .user-info { margin-left: auto; color: #ecf0f1; display: flex; align-items: center; gap: 1rem; }
        nav.tabs .user-info .role-badge { padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .role-superadmin { background: #e74c3c; color: white; }
        .role-admin { background: #f39c12; color: white; }
        .role-viewer { background: #95a5a6; color: white; }
        #content { flex: 1; overflow: hidden; position: relative; }

        .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
        .toolbar input[type="text"] { padding: 0.5rem 0.8rem; border: 1px solid var(--border); border-radius: 4px; flex: 1; min-width: 200px; font-size: 0.9rem; }
        .toolbar select { padding: 0.5rem 0.8rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.9rem; background: white; }
        .btn { padding: 0.5rem 1rem; border: 1px solid transparent; border-radius: 4px; background: var(--accent); color: white; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; white-space: nowrap; }
        .btn:hover { background: #2980b9; }
        .btn.secondary { background: #95a5a6; }
        .btn.secondary:hover { background: #7f8c8d; }
        .btn.danger { background: var(--danger); }
        .btn.danger:hover { background: #c0392b; }
        .btn.small { padding: 0.25rem 0.6rem; font-size: 0.8rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .main-content { display: flex; flex-direction: column; height: 100%; }
        .left-panel { flex: 1; overflow: auto; display: flex; flex-direction: column; padding: 1rem; }

        .right-panel {
            position: absolute; top: 0; right: 0; height: 100%; width: 400px; background: var(--panel);
            box-shadow: -2px 0 10px rgba(0,0,0,0.1); transform: translateX(100%); transition: transform 0.3s ease;
            z-index: 100; display: flex; flex-direction: column;
        }
        .right-panel.open { transform: translateX(0); }
        .panel-tab {
            position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: var(--accent);
            color: white; padding: 0.6rem 0.8rem; border-radius: 8px 0 0 8px; cursor: pointer; z-index: 101;
            box-shadow: -2px 2px 6px rgba(0,0,0,0.15); font-size: 0.9rem; font-weight: 600; display: flex;
            align-items: center; gap: 0.3rem; transition: opacity 0.3s;
        }
        .panel-tab.hidden { opacity: 0; pointer-events: none; }
        .right-panel .panel-header { padding: 0.8rem 1rem; background: #f8f9fa; border-bottom: 2px solid var(--border); font-weight: 600; color: var(--primary); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .right-panel .panel-close { cursor: pointer; font-size: 1.2rem; color: #999; }
        .right-panel .panel-close:hover { color: var(--danger); }
        .right-panel .panel-body { flex: 1; overflow-y: auto; padding: 0; }

        /* ... все остальные стили таблиц, модалок, досье, патч-панели ... (берутся из предыдущего полного кода) */
        .table-wrapper { background: var(--panel); border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); overflow-x: auto; flex: 1; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 0.9rem; }
        table thead th { padding: 0.6rem 0.8rem; background: #f8f9fa; border-bottom: 2px solid var(--border); text-align: left; cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 2; }
        table thead th:hover { background: #e9ecef; }
        table thead th .sort-icon { margin-left: 0.3rem; font-size: 0.7rem; opacity: 0.4; }
        table thead th.sorted .sort-icon { opacity: 1; color: var(--accent); }
        tr.data-row { cursor: pointer; transition: background 0.15s; }
        tr.data-row:hover { background: #f0f4f8; }
        tr.data-row.expanded { background: #e8f0fe; }
        tr.data-row td { padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--border); }
        tr.data-row td.expand-cell { width: 40px; text-align: center; }
        tr.data-row .expand-arrow { display: inline-block; transition: transform 0.25s ease; font-size: 0.8rem; color: #666; }
        tr.data-row.expanded .expand-arrow { transform: rotate(90deg); color: var(--accent); }
        tr.detail-row { display: none; }
        tr.detail-row.visible { display: table-row; animation: slideDown 0.25s ease; }
        tr.detail-row td { padding: 0; border-bottom: 2px solid var(--accent); background: var(--nested-bg); }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .nested-container { padding: 0.8rem 1rem; max-height: 400px; overflow-y: auto; }
        .nested-container .nested-title { font-weight: 600; margin-bottom: 0.5rem; color: var(--primary); font-size: 0.9rem; }
        .nested-container table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
        .nested-container table thead th { background: #e9ecef; padding: 0.4rem 0.6rem; font-size: 0.8rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
        .nested-container table tbody td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; }
        .nested-container table tbody tr:hover { background: #eef2f7; }
        .nested-container table tbody tr.selected { background: #d4e6f9; }

        .stack-row { background: var(--stack-bg); border-left: 3px solid #667eea; }
        .stack-row:hover { background: #e8ecff; }
        .stack-badge { display: inline-block; background: #667eea; color: white; padding: 0.15rem 0.5rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        tr.stack-detail-row { display: none; }
        tr.stack-detail-row.visible { display: table-row; animation: slideDown 0.25s ease; }
        tr.stack-detail-row td { padding: 0; border-bottom: 2px solid #667eea; background: #fafbff; }
        .stack-devices-container { padding: 0.8rem 1rem 0.8rem 2rem; max-height: 300px; overflow-y: auto; }

        .patch-panel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; padding: 10px; }
        .port-item { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 4px; border-radius: 8px; background: #f8f9fa; border: 1px solid #dee2e6; cursor: pointer; transition: all 0.2s; font-size: 0.8rem; }
        .port-item:hover { border-color: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .port-item.connected { background: #d4edda; border-color: #c3e6cb; }
        .port-item.disconnected { background: #f8d7da; border-color: #f5c6cb; }
        .port-number { font-weight: bold; font-size: 1rem; }
        .port-status { font-size: 0.7rem; margin-top: 2px; }
        .port-label { font-size: 0.7rem; color: #6c757d; margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .patch-panel-tools { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }

        /* Остальные стили (досье, сервисы, модалки) — такие же, как в предыдущем полном коде. */
        .equipment-dossier { display: flex; flex-direction: column; gap: 1.5rem; }
        .dossier-section { background: #f8f9fa; border-radius: 8px; padding: 1.2rem; border: 1px solid #e9ecef; }
        .dossier-section h4 { color: var(--primary); margin-bottom: 1rem; font-size: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .dossier-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.8rem; }
        .dossier-item { background: white; padding: 0.7rem 0.9rem; border-radius: 6px; border: 1px solid #e9ecef; }
        .dossier-item .label { font-size: 0.75rem; color: #6c757d; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.3rem; }
        .dossier-item .value { font-size: 0.95rem; font-weight: 600; color: var(--primary); }
        .modules-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1rem; }
        .module-column { background: white; border-radius: 8px; border: 1px solid #e9ecef; overflow: hidden; }
        .module-column-header { background: #f1f3f5; padding: 0.7rem 1rem; font-weight: 600; color: var(--primary); font-size: 0.9rem; display: flex; align-items: center; gap: 0.4rem; border-bottom: 1px solid #dee2e6; }
        .module-list { padding: 0.8rem; display: flex; flex-direction: column; gap: 0.6rem; max-height: 300px; overflow-y: auto; }
        .module-tile { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 0.7rem; transition: background 0.2s; }
        .module-tile:hover { background: #e9ecef; }
        .module-tile .module-name { font-weight: 600; font-size: 0.85rem; color: var(--primary); margin-bottom: 0.3rem; }
        .module-tile .module-details { display: flex; gap: 0.8rem; font-size: 0.75rem; color: #6c757d; flex-wrap: wrap; }
        .add-module-tile { background: white; border: 2px dashed #adb5bd; border-radius: 6px; padding: 0.7rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.4rem; color: #6c757d; font-size: 0.85rem; }
        .add-module-tile:hover { border-color: var(--accent); color: var(--accent); background: #f0f8ff; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.8rem; }
        .service-card { background: white; padding: 1rem; border-radius: 8px; border: 1px solid #e9ecef; text-align: center; }
        .service-card .service-name { font-size: 0.85rem; font-weight: 600; color: var(--primary); margin-bottom: 0.5rem; }
        .service-card .service-status { font-size: 0.8rem; font-weight: 600; padding: 0.3rem 0.8rem; border-radius: 12px; display: inline-block; }
        .service-connected { background: #d4edda; color: #155724; }
        .service-disconnected { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<div id="loginScreen">
    <div class="login-box">
        <div class="logo">🖧</div>
        <h2>NetInfra Manager</h2>
        <input type="text" id="loginInput" placeholder="Логин">
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button id="loginBtn">Войти</button>
        <div class="error" id="loginError"></div>
    </div>
</div>

<div id="appScreen">
    <nav class="tabs">
        <button data-tab="nodes" class="active">Узлы</button>
        <button data-tab="warehouse">Склад</button>
        <button data-tab="checklist">Чек-лист</button>
        <button data-tab="logs">Журнал</button>
        <button data-tab="users" id="usersTab" style="display:none;">Пользователи</button>
        <div class="user-info">
            <span id="userName"></span>
            <span id="userRole" class="role-badge"></span>
            <button class="btn small secondary" id="logoutBtn">Выйти</button>
        </div>
    </nav>
    <div id="content">
        <div class="main-content" id="mainContent"></div>
        <div class="panel-tab" id="panelTab">🔧 Шкаф</div>
        <div class="right-panel" id="rightPanel">
            <div class="panel-header"><span id="panelTitle">Шкаф</span><span class="panel-close" id="panelClose">✕</span></div>
            <div class="panel-body" id="panelBody"><div style="padding:1rem;text-align:center;color:#999;">Выберите оборудование</div></div>
        </div>
    </div>
</div>

<ul class="context-menu" id="contextMenu"></ul>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>
<div class="toast-container" id="toastContainer"></div>

<script>
// ==================== ДАННЫЕ И ГЕНЕРАЦИЯ (полная версия) ====================
const usersDB = [
    { id: 1, login: 'admin', password: 'admin', full_name: 'Администратор Системы', role: 'admin', email: 'admin@netinfra.local' },
    { id: 2, login: 'superadmin', password: 'superadmin', full_name: 'Суперадминистратор', role: 'superadmin', email: 'superadmin@netinfra.local' },
    { id: 3, login: 'viewer', password: 'viewer', full_name: 'Наблюдатель Петров', role: 'viewer', email: 'viewer@netinfra.local' },
];
function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randomIp() { return `${Math.floor(Math.random()*223)+1}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*254)+1}`; }
function randomSerial() { return Math.random().toString(36).substring(2, 10).toUpperCase(); }
function randomMac() { const hex = '0123456789ABCDEF'; let mac = ''; for (let i = 0; i < 12; i++) { mac += hex[Math.floor(Math.random() * 16)]; if (i % 2 === 1 && i < 11) mac += ':'; } return mac; }

const vendors = ['Cisco', 'Juniper', 'HP', 'Arista', 'D-Link', 'Ubiquiti', 'MikroTik', 'Huawei', 'Dell', 'Supermicro'];
const switchModels = ['Catalyst 2960X', 'Catalyst 9200', 'EX3400', 'Aruba 2930F', '7050SX', 'DGS-1210-52', 'DGS-1210-28P', 'S5720', 'CRS326', 'ICX 7150'];
const routerModels = ['MX204', 'ISR 4321', 'CCR1036', 'AR1200', 'SRX340'];
const serverModels = ['ProLiant DL380', 'PowerEdge R740', 'UCS C220', 'ThinkSystem SR650', 'PRIMERGY RX2540'];
const upsModels = ['Smart-UPS 3000', 'Smart-UPS 1500', '5P 1550', 'Galaxy 5500', 'Symmetra LX'];
const locations = ['Корпус А, этаж 1', 'Корпус А, этаж 2', 'Корпус А, этаж 3', 'Корпус А, этаж 4', 'Корпус А, этаж 5', 'Корпус Б, этаж 1', 'Корпус Б, этаж 2', 'Корпус Б, подвал', 'Корпус В, 1 этаж', 'Складское помещение'];
const nodeTypes = ['агрегации', 'доступа', 'прочее'];
const equipTypes = ['Коммутатор', 'Маршрутизатор', 'ИБП', 'Сервер', 'Точка доступа', 'Стек', 'Патч-панель'];
const checklistStatuses = ['new', 'in_progress', 'done', 'cancelled'];
const actionTypes = ['create', 'update', 'move', 'delete', 'checklist_add'];
const cabinetTypes = { '19-ти юнитовый': 19, '24-х юнитовый': 24, '32-х юнитовый': 32, '42-х юнитовый': 42, '48-ми юнитовый': 48, 'Без шкафа': 0, 'Прочее': 0 };

const nodes = [];
for (let i = 1; i <= 55; i++) {
    nodes.push({ id: i, name: `КУ-${i} (${randomItem(['Серверная','Этаж','ЦОД','Офис','Склад','Переговорная','Бухгалтерия','Wi-Fi','Резерв','Тестовая'])} ${i})`, location: randomItem(locations), type: randomItem(nodeTypes), logical_device_access: `ЛУ-${i}`, description: i % 5 === 0 ? 'Важный узел' : '', created_at: new Date(2024, Math.floor(Math.random()*12), Math.floor(Math.random()*28)+1).toISOString().slice(0,10) });
}
const cabinetPool = {};
for (let i = 1; i <= 55; i++) {
    cabinetPool[i] = [];
    for (let j = 0; j < Math.floor(Math.random()*3)+1; j++) {
        const cabType = randomItem(['19-ти юнитовый','24-х юнитовый','32-х юнитовый','42-х юнитовый']);
        cabinetPool[i].push({ name: `ШК-${j+1}`, type: cabType, size: cabinetTypes[cabType] });
    }
}

const sfpModules = [
    { name: 'SFP-10G-SR', type: '10G SFP+', serial: 'SFP'+Math.random().toString(36).substring(2,8).toUpperCase(), wavelength: '850nm', distance: '300m' },
    { name: 'SFP-10G-LR', type: '10G SFP+', serial: 'SFP'+Math.random().toString(36).substring(2,8).toUpperCase(), wavelength: '1310nm', distance: '10km' },
    { name: 'GLC-SX-MMD', type: '1G SFP', serial: 'SFP'+Math.random().toString(36).substring(2,8).toUpperCase(), wavelength: '850nm', distance: '550m' },
    { name: 'GLC-LH-SMD', type: '1G SFP', serial: 'SFP'+Math.random().toString(36).substring(2,8).toUpperCase(), wavelength: '1310nm', distance: '10km' },
    { name: 'SFP-25G-SR', type: '25G SFP28', serial: 'SFP'+Math.random().toString(36).substring(2,8).toUpperCase(), wavelength: '850nm', distance: '100m' },
];
const psuModules = [
    { name: 'PWR-C1-350WAC', type: 'AC 350W', serial: 'PSU'+Math.random().toString(36).substring(2,8).toUpperCase(), status: 'OK' },
    { name: 'PWR-C1-715WAC', type: 'AC 715W', serial: 'PSU'+Math.random().toString(36).substring(2,8).toUpperCase(), status: 'OK' },
    { name: 'PWR-C1-1100WAC', type: 'AC 1100W', serial: 'PSU'+Math.random().toString(36).substring(2,8).toUpperCase(), status: 'Warning' },
    { name: 'PWR-C6-600WAC', type: 'AC 600W', serial: 'PSU'+Math.random().toString(36).substring(2,8).toUpperCase(), status: 'OK' },
];

const stacks = {};
const equipmentModules = {};
const equipment = [];
let eqId = 1, stackId = 1;
for (let i = 0; i < 8; i++) {
    const vendor = randomItem(vendors);
    stacks[stackId] = {
        id: stackId, ip_address: randomIp(), hostname: `stack-${stackId}.netinfra.local`, vendor, note: `Стек ${vendor}`,
        devices: Array.from({length: Math.floor(Math.random()*3)+2}, (_,j) => ({
            id: `dev-${stackId}-${j+1}`, type: 'Коммутатор', hostname: `sw-${stackId}-${j+1}`,
            ip_address: randomIp(), vendor, model: randomItem(switchModels), serial_number: randomSerial(),
            mac_address: randomMac(), firmware: `v${Math.floor(Math.random()*10)}.${Math.floor(Math.random()*10)}.${Math.floor(Math.random()*10)}`
        }))
    };
    stackId++;
}
for (let i = 1; i <= 55; i++) {
    const inNode = i <= 45;
    const nodeId = inNode ? Math.ceil(Math.random()*45) : null;
    let type = (i % 8 === 0 && inNode) ? 'Стек' : randomItem(equipTypes.filter(t => t !== 'Стек' && t !== 'Патч-панель'));
    let cabinetName = '—', cabinetTypeVal = 'Без шкафа', cabinetSize = 0, unit = null;
    if (inNode && i % 5 !== 0 && cabinetPool[nodeId]?.length) {
        const cab = randomItem(cabinetPool[nodeId]);
        cabinetName = cab.name; cabinetTypeVal = cab.type; cabinetSize = cab.size;
        unit = Math.floor(Math.random()*cabinetSize)+1;
    }
    const eq = {
        id: eqId, node_id: nodeId, location_type: inNode?'node':'warehouse', type,
        hostname: type==='Стек'?`stack-${eqId}`:`${type.toLowerCase().replace(/[^a-z]/g,'')}-${String(eqId).padStart(3,'0')}`,
        ip_address: inNode?randomIp():'', vendor: randomItem(vendors),
        model: type==='Коммутатор'?randomItem(switchModels):type==='Маршрутизатор'?randomItem(routerModels):type==='Сервер'?randomItem(serverModels):type==='ИБП'?randomItem(upsModels):'Stack',
        serial_number: type==='Стек'?'':randomSerial(), mac_address: type==='Стек'?'':randomMac(),
        firmware: type==='Стек'?'':`v${Math.floor(Math.random()*10)}.${Math.floor(Math.random()*10)}.${Math.floor(Math.random()*10)}`,
        data_status: Math.random()>0.8?'update_needed':'ok', is_active: inNode?Math.random()>0.25:false,
        cabinet: cabinetName, cabinet_type: cabinetTypeVal, unit, created_at: new Date(2024,Math.floor(Math.random()*12),Math.floor(Math.random()*28)+1).toISOString().slice(0,10),
        stack_id: type==='Стек'?(eqId%8+1):null
    };
    equipment.push(eq);
    if (type==='Коммутатор'||type==='Маршрутизатор') {
        equipmentModules[eqId] = {
            sfp: Array.from({length:Math.floor(Math.random()*4)+1},()=>({...randomItem(sfpModules)})),
            psu: Array.from({length:Math.floor(Math.random()*2)+1},()=>({...randomItem(psuModules)}))
        };
    }
    eqId++;
}
for (let i=0;i<15;i++) {
    const nodeId = Math.ceil(Math.random()*45);
    const nodeEqs = equipment.filter(e=>e.node_id===nodeId&&e.cabinet!=='—');
    if(!nodeEqs.length) continue;
    const tpl = randomItem(nodeEqs);
    const type = randomItem(equipTypes.filter(t=>t!=='Стек'&&t!=='Патч-панель'));
    const usedUnits = nodeEqs.filter(e=>e.cabinet===tpl.cabinet).map(e=>e.unit).filter(Boolean);
    const cabSize = cabinetTypes[tpl.cabinet_type]||0;
    const freeUnits = []; for(let u=1;u<=cabSize;u++) if(!usedUnits.includes(u)) freeUnits.push(u);
    const unit = freeUnits.length?randomItem(freeUnits):Math.floor(Math.random()*cabSize)+1;
    const eq = {
        id: eqId, node_id: nodeId, location_type:'node', type,

function renderCurrentTab(){
    const config=columnConfigs[currentTab],visibleCols=getVisibleColumns(currentTab),rawData=getDataSource(currentTab),sq=config.search.toLowerCase(),isNodesTab=currentTab==='nodes';
    let filtered=rawData.filter(row=>{if(!sq)return true;return visibleCols.some(col=>{const v=row[col.field];return v!==null&&v!==undefined&&String(v).toLowerCase().includes(sq);});});

    const total=filtered.length,totalPages=Math.ceil(total/config.perPage);if(config.page>totalPages)config.page=Math.max(1,totalPages);

    let hh='<tr>';visibleCols.forEach(col=>{const s=col.field===config.sortField;hh+=`<th data-field="${col.field}" class="${s?'sorted':''}">${col.title} <span class="sort-icon">${s?(config.sortOrder==='asc'?'↑':'↓'):'↕'}</span></th>`;});hh+='<th style="width:40px;"></th></tr>';thead.innerHTML=hh;
    thead.querySelectorAll('th[data-field]').forEach(th=>{th.addEventListener('click',()=>{const f=th.dataset.field;if(config.sortField===f)config.sortOrder=config.sortOrder==='asc'?'desc':'asc';else{config.sortField=f;config.sortOrder='asc';}renderCurrentTab();});});
    const tbody=document.getElementById('tableBody');let bh='';

        const rid=row.id,isExp=expandedNodeId===rid&&isNodesTab,isLoad=loadingNodeId===rid&&isNodesTab;
        bh+=`<tr class="data-row ${isExp?'expanded':''}" data-id="${rid}">`;
        visibleCols.forEach(col=>{let v=row[col.field];if(v===null||v===undefined)v='';if(col.type==='status'&&isNodesTab){const st=row.node_status||'inactive';const lb={active:'Активен',partial:'Частично',inactive:'Не активен'};v=`<span class="blink-dot ${st}"></span> ${lb[st]}`;}else if(col.type==='status'&&currentTab==='warehouse')v='<span class="blink-dot inactive"></span> Не активен';if(col.field==='equipment_count')v=`<span class="equipment-count">${v} шт.</span>`;if(col.field==='data_status')v=`<span class="status-badge ${v==='update_needed'?'status-update':'status-ok'}">${v==='update_needed'?'⚠ Обновить':'OK'}</span>`;if(col.field==='status'&&col.type!=='status')v=`<span class="status-badge status-${v}">${v}</span>`;if(col.field==='unit')v=v?`<span class="unit-badge">${v}</span>`:'—';if(col.field==='role'){const rc=v==='superadmin'?'role-superadmin':v==='admin'?'role-admin':'role-viewer';v=`<span class="role-badge ${rc}">${v}</span>`;}bh+=`<td>${v}</td>`;});
        bh+=`<td class="expand-cell">${isNodesTab?(isLoad?'<span class="load-indicator loading"></span>':'<span class="expand-arrow">▶</span>'):''}</td></tr>`;
        if(isNodesTab)bh+=`<tr class="detail-row ${isExp?'visible':''}" data-id="${rid}"><td colspan="${visibleCols.length+1}"><div class="nested-container" id="nested-${rid}">${renderNestedContent(rid)}</div></td></tr>`;
    });

    tbody.innerHTML=bh;
    if(isNodesTab){
        tbody.querySelectorAll('tr.data-row').forEach(row=>row.addEventListener('click',()=>handleNodeClick(parseInt(row.dataset.id))));

            const eid=parseInt(row.dataset.equipId),eq=equipment.find(e=>e.id===eid);

        });
        tbody.querySelectorAll('tr.data-row').forEach(row=>{row.addEventListener('contextmenu',e=>{if(!canEdit())return;showNodeContextMenu(e,parseInt(row.dataset.id));});});
    }
    if(currentTab==='users'&&canManageUsers())tbody.querySelectorAll('tr.data-row').forEach(row=>{row.addEventListener('contextmenu',e=>{showUserContextMenu(e,parseInt(row.dataset.id));});});

function renderNestedContent(nid){

function renderPagination(tp,total){const cfg=columnConfigs[currentTab];const ct=document.getElementById('pagination');if(tp<=1){ct.innerHTML=`<span class="page-info">Всего записей: ${total}</span>`;return;}let h=`<button ${cfg.page===1?'disabled':''} data-page="1">««</button><button ${cfg.page===1?'disabled':''} data-page="${cfg.page-1}">«</button>`;const sp=Math.max(1,cfg.page-2),ep=Math.min(tp,cfg.page+2);for(let i=sp;i<=ep;i++)h+=`<button class="${i===cfg.page?'active':''}" data-page="${i}">${i}</button>`;h+=`<button ${cfg.page===tp?'disabled':''} data-page="${cfg.page+1}">»</button><button ${cfg.page===tp?'disabled':''} data-page="${tp}">»»</button><span class="page-info">Стр. ${cfg.page} из ${tp} (${total})</span>`;ct.innerHTML=h;ct.querySelectorAll('button[data-page]').forEach(b=>b.addEventListener('click',()=>{cfg.page=parseInt(b.dataset.page);expandedNodeId=null;selectedEquipmentId=null;expandedStackId=null;renderCurrentTab();}));}

function openStackForm(nodeId){
    const overlay=document.getElementById('modalOverlay'),modal=document.getElementById('modalBox');modal.className='modal wide';
    const tmpId=Date.now();window.tempStacks=window.tempStacks||{};window.tempStacks[tmpId]={devices:[]};
    const renderForm=()=>{
        const devs=window.tempStacks[tmpId].devices;
        let dh='';devs.forEach((d,i)=>dh+=`<div class="stack-device-tile"><div class="stack-device-info"><div class="device-name">${escapeHtml(d.hostname)}</div><div class="device-details">${escapeHtml(d.type)} | ${escapeHtml(d.model)}</div></div><div class="stack-device-actions"><button class="btn small secondary" onclick="editStackDevice(${tmpId},${i})">✏️</button><button class="btn small danger" onclick="removeStackDevice(${tmpId},${i})">✕</button></div></div>`);
        modal.innerHTML=`<h3>📦 Создание стека</h3><div class="equipment-dossier"><div class="dossier-section"><h4>Основная информация</h4><div class="dossier-grid"><div class="form-group"><label>IP-адрес</label><input id="stackIp" value="${randomIp()}"></div><div class="form-group"><label>Имя хоста</label><input id="stackHostname" value="stack-${Math.floor(Math.random()*100)}.local"></div><div class="form-group"><label>Производитель</label><select id="stackVendor">${vendors.map(v=>`<option>${v}</option>`).join('')}</select></div><div class="form-group"><label>Примечание</label><input id="stackNote"></div></div></div><div class="dossier-section"><h4>🔧 Устройства в стеке</h4><div class="module-list">${dh||'<div style="color:#999;text-align:center;">Нет устройств</div>'}<div class="add-module-tile" onclick="addStackDevice(${tmpId})">+ Добавить устройство</div></div></div></div><div class="modal-actions"><button class="btn secondary" id="modalCancel">Отмена</button><button class="btn" id="modalSaveStack">Сохранить стек</button></div>`;
        document.getElementById('modalCancel').addEventListener('click',()=>overlay.style.display='none');
        document.getElementById('modalSaveStack').addEventListener('click',()=>{
            const ip=document.getElementById('stackIp').value,host=document.getElementById('stackHostname').value,vendor=document.getElementById('stackVendor').value,note=document.getElementById('stackNote').value;
            const nsid=Object.keys(stacks).length+1;stacks[nsid]={id:nsid,ip_address:ip,hostname:host,vendor,note,devices:devs.map(d=>({...d}))};
            equipment.push({id:Date.now(),node_id:nodeId,location_type:'node',type:'Стек',hostname:host,ip_address:ip,vendor,model:'Stack',is_active:true,cabinet:'—',cabinet_type:'Без шкафа',unit:null,stack_id:nsid});
            loadedNestedData={};showToast('Стек создан','success');overlay.style.display='none';renderCurrentTab();
        });
    };
    window.addStackDevice=function(sid){const v=document.getElementById('stackVendor')?.value||'Cisco';const ip=document.getElementById('stackIp')?.value||'192.168.1.1';showStackDeviceForm(sid,null,{ip_address:ip,vendor:v,hostname:`sw-${sid}-${window.tempStacks[sid].devices.length+1}`});};
    window.editStackDevice=function(sid,i){showStackDeviceForm(sid,i,window.tempStacks[sid].devices[i]);};
    window.removeStackDevice=function(sid,i){window.tempStacks[sid].devices.splice(i,1);renderForm();};
    overlay.style.display='flex';renderForm();
}

    const dev=idx!==null?window.tempStacks[sid].devices[idx]:{};
    modal.innerHTML=`<h3>${idx!==null?'Редактировать':'Добавить'} устройство</h3>
    <div class="form-group"><label>Тип</label><select id="dType">${equipTypes.filter(t=>t!=='Стек'&&t!=='Патч-панель').map(t=>`<option ${(dev.type||prefill.type||'Коммутатор')===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="form-group"><label>IP</label><input id="dIp" value="${escapeHtml(dev.ip_address||prefill.ip_address||'')}"></div>

    <div class="form-group"><label>Производитель</label><select id="dVendor">${vendors.map(v=>`<option ${(dev.vendor||prefill.vendor||'')===v?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="form-group"><label>Модель</label><input id="dModel" value="${escapeHtml(dev.model||'')}"></div>
    <div class="form-group"><label>Серийный</label><input id="dSerial" value="${escapeHtml(dev.serial_number||'')}"></div>

    <div class="form-group"><label>Прошивка</label><input id="dFw" value="${escapeHtml(dev.firmware||'')}"></div>
    <div class="modal-actions"><button class="btn secondary" id="modalCancelDev">Отмена</button><button class="btn" id="modalSaveDev">Сохранить</button></div>`;

function openStackFormContinue(sid){const overlay=document.getElementById('modalOverlay');overlay.style.display='none';openStackForm(null);}

// ==================== ПАТЧ-ПАНЕЛЬ ====================
function addPatchPanel(cabEquipId){
    const eq=equipment.find(e=>e.id===cabEquipId);if(!eq)return;
    const cabSize=cabinetTypes[eq.cabinet_type];const nodeEq=loadedNestedData[eq.node_id]||getEquipmentForNode(eq.node_id);
    const used=nodeEq.filter(e=>e.cabinet===eq.cabinet).flatMap(e=>e.unit?Array.from({length:e.size_u||1},(_,i)=>e.unit+i):[]);
    const findFree=s=>{for(let st=1;st<=cabSize-s+1;st++){let free=true;for(let u=st;u<st+s;u++)if(used.includes(u)){free=false;break;}if(free)return st;}return null;};
    showModal('Добавить патч-панель',`<div class="form-group"><label>Порты</label><select id="ppPorts"><option value="24">24</option><option value="48">48</option></select></div><div class="form-group"><label>Размер (U)</label><select id="ppSize"><option value="1">1U</option><option value="2">2U</option></select></div><div class="form-group"><label>Имя</label><input id="ppName" value="Патч-панель"></div>`,()=>{
        const cnt=parseInt(document.getElementById('ppPorts').value),sz=parseInt(document.getElementById('ppSize').value),name=document.getElementById('ppName').value;
        const st=findFree(sz);if(st===null){showToast('Нет места','error');return false;}
        const ports=[];for(let i=1;i<=cnt;i++)ports.push({number:i,status:Math.random()>0.5?'connected':'disconnected',label:`Порт ${i}`});
        equipment.push({id:Date.now(),node_id:eq.node_id,location_type:'node',type:'Патч-панель',hostname:name,ip_address:'',vendor:'Generic',model:`${cnt}-порт.`,is_active:true,cabinet:eq.cabinet,cabinet_type:eq.cabinet_type,unit:st,size_u:sz,ports});
        loadedNestedData[eq.node_id]=getEquipmentForNode(eq.node_id);showToast('Патч-панель добавлена','success');renderCurrentTab();if(panelOpen&&selectedEquipmentId)updatePanelView();
    });
}
function showPatchPanelPorts(eid){
    const eq=equipment.find(e=>e.id===eid);if(!eq||eq.type!=='Патч-панель')return;
    const overlay=document.getElementById('modalOverlay'),modal=document.getElementById('modalBox');modal.className='modal wide';
    const render=()=>{
        let h=`<h3>${escapeHtml(eq.hostname)} (${eq.model})</h3><div class="patch-panel-tools"><button class="btn small" onclick="toggleAllPorts(${eid},'connected')">Подключить все</button><button class="btn small secondary" onclick="toggleAllPorts(${eid},'disconnected')">Отключить все</button></div><div class="patch-panel-grid">`;
        eq.ports.forEach(p=>{const cls=p.status==='connected'?'connected':'disconnected';h+=`<div class="port-item ${cls}" onclick="togglePort(${eid},${p.number})"><span class="port-number">${p.number}</span><span class="port-status">${p.status==='connected'?'🟢':'🔴'}</span><span class="port-label">${escapeHtml(p.label)}</span></div>`;});
        h+=`</div><div class="modal-actions"><button class="btn secondary" id="modalClosePorts">Закрыть</button><button class="btn" id="modalEditLabels">Редактировать подписи</button></div>`;
        modal.innerHTML=h;
        document.getElementById('modalClosePorts').addEventListener('click',()=>overlay.style.display='none');
        document.getElementById('modalEditLabels').addEventListener('click',()=>editPortLabels(eid));
    };
    window.togglePort=function(eid,pn){const eq=equipment.find(e=>e.id===eid);if(!eq)return;const p=eq.ports.find(pp=>pp.number===pn);if(p){p.status=p.status==='connected'?'disconnected':'connected';showToast(`Порт ${pn}: ${p.status}`,'info');render();}};
    window.toggleAllPorts=function(eid,st){const eq=equipment.find(e=>e.id===eid);if(!eq)return;eq.ports.forEach(p=>p.status=st);showToast(`Все порты ${st==='connected'?'подключены':'отключены'}`,'success');render();};
    window.editPortLabels=function(eid){const eq=equipment.find(e=>e.id===eid);if(!eq)return;let lh='';eq.ports.forEach(p=>lh+=`<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px;"><span style="min-width:40px;">Порт ${p.number}:</span><input id="pl_${p.number}" value="${escapeHtml(p.label)}" style="flex:1;"></div>`);showModal('Подписи портов',lh,()=>{eq.ports.forEach(p=>{const nv=document.getElementById(`pl_${p.number}`).value;if(nv)p.label=nv;});showToast('Подписи обновлены','success');render();});};
    render();overlay.style.display='flex';
}

// ==================== ОБРАБОТЧИК КЛИКА ПО ОБОРУДОВАНИЮ (важно!) ====================
function handleEquipmentClick(equipId){
    const eq = equipment.find(e => e.id === equipId);
    if (!eq) return;
    if (eq.type === 'Стек' || eq.type === 'Патч-панель') return;
    if (eq.cabinet === '—' || eq.cabinet_type === 'Без шкафа' || !cabinetTypes[eq.cabinet_type] || cabinetTypes[eq.cabinet_type] === 0) {
        showToast('Данное оборудование без шкафа', 'warning', 4000);
        if (panelOpen) { panelOpen = false; selectedEquipmentId = null; updatePanelView(); }
        return;
    }
    if (selectedEquipmentId === equipId && panelOpen) {
        panelOpen = false; selectedEquipmentId = null; updatePanelView(); return;
    }
    selectedEquipmentId = equipId; panelOpen = true; updatePanelView(); renderCurrentTab();
}

// ==================== ПЕРЕМЕЩЕНИЕ (полные функции) ====================
function moveToUnitDialog(equipId){
    const eq = equipment.find(e => e.id === equipId);
    if (!eq || eq.cabinet === '—') return;
    const cabSize = cabinetTypes[eq.cabinet_type] || 0;
    const nodeEq = loadedNestedData[eq.node_id] || getEquipmentForNode(eq.node_id);
    const used = nodeEq.filter(e => e.cabinet === eq.cabinet && e.id !== equipId).flatMap(e => e.unit? Array.from({length: e.size_u||1}, (_,i) => e.unit+i) : []);
    const free = []; for (let u=1; u<=cabSize; u++) if(!used.includes(u)) free.push(u);
    free.push(eq.unit);
    const opts = free.sort((a,b)=>a-b).map(u => `<option value="${u}" ${u===eq.unit?'selected':''}>Юнит ${u}</option>`).join('');
    showModal('Переместить оборудование', `<div class="form-group"><label>Новый юнит в шкафу ${eq.cabinet}</label><select id="newUnit">${opts}</select></div>`, () => {
        const newUnit = parseInt(document.getElementById('newUnit').value);
        if (newUnit && newUnit !== eq.unit) {
            eq.unit = newUnit;
            actionLog.push({ id: Date.now(), user: currentUser.login, action_type: 'move_unit', entity_type: 'equipment', entity_id: eq.id, description: `Перемещено в юнит ${newUnit}`, performed_at: new Date().toISOString().slice(0,16).replace('T',' ') });
            loadedNestedData[eq.node_id] = getEquipmentForNode(eq.node_id);
            showToast(`Оборудование перемещено в юнит ${newUnit}`, 'success');
            renderCurrentTab();
            if (panelOpen && selectedEquipmentId === eq.id) updatePanelView();
        }
    });
}
function moveToWarehouse(equipId){
    const eq = equipment.find(e => e.id === equipId);
    if (!eq) return;
    eq.location_type = 'warehouse'; eq.node_id = null; eq.cabinet = '—'; eq.cabinet_type = 'Без шкафа'; eq.unit = null; eq.is_active = false; eq.ip_address = '';
    actionLog.push({ id: Date.now(), user: currentUser.login, action_type: 'move', entity_type: 'equipment', entity_id: eq.id, description: 'Перемещено на склад', performed_at: new Date().toISOString().slice(0,16).replace('T',' ') });
    loadedNestedData = {};
    if (selectedEquipmentId === eq.id) { selectedEquipmentId = null; panelOpen = false; }
    updatePanelView(); showToast('Оборудование перемещено на склад', 'success'); renderCurrentTab();
}
function moveToNodeDialog(equipId){
    const opts = nodes.map(n => `<option value="${n.id}">${n.name}</option>`).join('');
    showModal('Переместить в узел', `<div class="form-group"><label>Узел</label><select id="moveTargetNode">${opts}</select></div>`, () => {
        const nodeId = parseInt(document.getElementById('moveTargetNode').value);
        const eq = equipment.find(e => e.id === equipId);
        if (eq) {
            eq.node_id = nodeId; eq.location_type = 'node'; eq.is_active = true; eq.ip_address = randomIp();
            const cab = cabinetPool[nodeId] ? randomItem(cabinetPool[nodeId]) : null;
            if (cab) { eq.cabinet = cab.name; eq.cabinet_type = cab.type; eq.unit = Math.floor(Math.random()*cab.size)+1; }
            else { eq.cabinet = '—'; eq.cabinet_type = 'Без шкафа'; eq.unit = null; }
            actionLog.push({ id: Date.now(), user: currentUser.login, action_type: 'move', entity_type: 'equipment', entity_id: eq.id, description: `Перемещено в узел ${nodeId}`, performed_at: new Date().toISOString().slice(0,16).replace('T',' ') });
            loadedNestedData = {};
            showToast('Оборудование перемещено в узел', 'success'); renderCurrentTab();
        }
    });
}

// ==================== РЕНДЕР ШКАФА (финальная версия) ====================
function renderCabinetContent(eid){
    const eq=equipment.find(e=>e.id===eid);if(!eq||eq.cabinet==='—'||!cabinetTypes[eq.cabinet_type]){document.getElementById('panelTitle').textContent='Шкаф';document.getElementById('panelBody').innerHTML='<div style="padding:1rem;text-align:center;color:#999;">Нет данных</div>';return;}
    const size=cabinetTypes[eq.cabinet_type];document.getElementById('panelTitle').textContent=`${eq.cabinet} (${eq.cabinet_type})`;
    const ne=loadedNestedData[eq.node_id]||getEquipmentForNode(eq.node_id);const ce=ne.filter(e=>e.cabinet===eq.cabinet);
    const um={};ce.forEach(e=>{if(e.unit)for(let u=e.unit;u<e.unit+(e.size_u||1);u++)um[u]={id:e.id,ip:e.ip_address||'—',active:e.is_active,hostname:e.hostname,type:e.type};});
    let h=`<div class="legend"><span><span class="legend-dot green"></span> Активно</span><span><span class="legend-dot orange"></span> Неактивно</span><span><span class="legend-dot gray"></span> Свободно</span></div><div style="padding:0.5rem;text-align:right;"><button class="btn small" id="addPatchBtn">➕ Патч-панель</button></div><div class="table-wrapper"><table><thead><tr><th>Юнит</th><th>Устройство</th><th>IP</th><th>Статус</th></tr></thead><tbody>`;
    for(let u=1;u<=size;u++){const inf=um[u];if(inf){const cls=inf.active?'occupied':'occupied-inactive';h+=`<tr class="${cls} cabinet-row" data-unit="${u}" data-equip-id="${inf.id}" ${canEdit()&&inf.type!=='Патч-панель'?'draggable="true"':''}><td>${u}</td><td>${inf.hostname}${inf.type==='Патч-панель'?' 🔌':''}</td><td>${inf.ip}</td><td>${inf.active?'<span class="blink-dot active" style="width:10px;height:10px;"></span> Активен':'<span class="blink-dot inactive" style="width:10px;height:10px;"></span> Неактивен'}</td></tr>`;}
    else h+=`<tr class="empty cabinet-row" data-unit="${u}" data-equip-id="" ${canEdit()?'data-drop-target="true"':''}><td>${u}</td><td>—</td><td>—</td><td>Свободен</td></tr>`;}
    h+='</tbody></table></div>';document.getElementById('panelBody').innerHTML=h;
    document.getElementById('addPatchBtn')?.addEventListener('click',()=>addPatchPanel(selectedEquipmentId));
    document.getElementById('panelBody').querySelectorAll('.cabinet-row').forEach(row=>{
        const rid=parseInt(row.dataset.equipId);if(!rid)return;const re=equipment.find(e=>e.id===rid);
        row.addEventListener('click',()=>{if(re&&re.type==='Патч-панель')showPatchPanelPorts(rid);else handleEquipmentClick(rid);});
        if(canEdit()&&re&&re.type!=='Патч-панель'){
            row.setAttribute('draggable','true');
            row.addEventListener('dragstart',e=>{dragData={equipId:rid,fromUnit:parseInt(row.dataset.unit)};row.classList.add('dragover-drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',rid);});
            row.addEventListener('dragend',()=>row.classList.remove('dragover-drag'));
        }
        row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drop-target');});
        row.addEventListener('dragleave',()=>row.classList.remove('drop-target'));
        row.addEventListener('drop',e=>{
            e.preventDefault();row.classList.remove('drop-target');if(!dragData||!canEdit())return;
            const toUnit=parseInt(row.dataset.unit),toId=row.dataset.equipId?parseInt(row.dataset.equipId):null;
            if(toId===dragData.equipId)return;const mv=equipment.find(ev=>ev.id===dragData.equipId);
            if(!mv||mv.type==='Патч-панель')return;const ti=um[toUnit];if(ti&&ti.type==='Патч-панель'){showToast('Нельзя на место патч-панели','warning');return;}
            if(toId){const tg=equipment.find(ev=>ev.id===toId);if(tg&&tg.type!=='Патч-панель'){const tmp=mv.unit;mv.unit=tg.unit;tg.unit=tmp;}}
            else mv.unit=toUnit;
            actionLog.push({id:Date.now(),user:currentUser.login,action_type:'move_unit',entity_type:'equipment',entity_id:mv.id,description:`Перемещено из ${dragData.fromUnit} в ${mv.unit}`,performed_at:new Date().toISOString().slice(0,16).replace('T',' ')});
            loadedNestedData[mv.node_id]=getEquipmentForNode(mv.node_id);showToast(`Перемещено в юнит ${mv.unit}`,'success');dragData=null;renderCabinetContent(selectedEquipmentId);renderCurrentTab();
        });
    });
}

// ==================== ФОРМЫ ====================
function showModal(title,body,onSave){const ov=document.getElementById('modalOverlay'),mb=document.getElementById('modalBox');mb.className='modal';mb.innerHTML=`<h3>${title}</h3>${body}<div class="modal-actions"><button class="btn secondary" id="modalCancel">Отмена</button><button class="btn" id="modalSave">Сохранить</button></div>`;ov.style.display='flex';document.getElementById('modalCancel').addEventListener('click',()=>ov.style.display='none');document.getElementById('modalSave').addEventListener('click',()=>{const r=onSave();if(r!==false)ov.style.display='none';});ov.addEventListener('click',e=>{if(e.target===ov)ov.style.display='none';});}
function openNodeForm(nid){const n=nid?nodes.find(n=>n.id===nid):null;showModal(n?'Редактировать узел':'Новый узел',`<div class="form-group"><label>Название</label><input id="nodeName" value="${escapeHtml(n?.name||'')}"></div><div class="form-group"><label>Расположение</label><input id="nodeLocation" value="${escapeHtml(n?.location||'')}"></div><div class="form-group"><label>Тип</label><input id="nodeType" value="${escapeHtml(n?.type||'')}"></div><div class="form-group"><label>ЛУ доступа</label><input id="nodeLDA" value="${escapeHtml(n?.logical_device_access||'')}"></div>`,()=>{const d={name:document.getElementById('nodeName').value,location:document.getElementById('nodeLocation').value,type:document.getElementById('nodeType').value,logical_device_access:document.getElementById('nodeLDA').value};if(n)Object.assign(n,d);else nodes.push({id:Date.now(),...d,created_at:new Date().toISOString().slice(0,10)});showToast(n?'Узел обновлён':'Узел создан','success');renderCurrentTab();});}
function openEquipmentForm(eid,nodeId,locType='node'){const eq=eid?equipment.find(e=>e.id===eid):null;showModal(eq?'Редактировать':'Добавить',`<div class="form-group"><label>Тип</label><select id="eqType">${equipTypes.map(t=>`<option ${eq?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="form-group"><label>Имя хоста</label><input id="eqHostname" value="${escapeHtml(eq?.hostname||'')}"></div><div class="form-group"><label>IP</label><input id="eqIp" value="${escapeHtml(eq?.ip_address||'')}"></div><div class="form-group"><label>Модель</label><input id="eqModel" value="${escapeHtml(eq?.model||'')}"></div>`,()=>{const type=document.getElementById('eqType').value;if(type==='Стек'){openStackForm(nodeId||eq?.node_id);return false;}const d={type,hostname:document.getElementById('eqHostname').value,ip_address:document.getElementById('eqIp').value,model:document.getElementById('eqModel').value};if(eq){Object.assign(eq,d);loadedNestedData={};}else equipment.push({id:Date.now(),node_id:nodeId,location_type:locType,is_active:locType==='node',cabinet:'—',cabinet_type:'Без шкафа',unit:null,...d});showToast(eq?'Обновлено':'Добавлено','success');renderCurrentTab();});}
function openTaskForm(tid){/* заглушка, можно доработать */}

// ==================== ПОДРОБНОЕ ДОСЬЕ ====================
function showEquipmentDetails(eid){
    const eq=equipment.find(e=>e.id===eid);if(!eq)return;if(eq.type==='Стек'){showStackManagement(eid);return;}
    if(eq.type==='Патч-панель'){showPatchPanelPorts(eid);return;}
    const mods=equipmentModules[eid]||{sfp:[],psu:[]},node=eq.node_id?nodes.find(n=>n.id===eq.node_id):null;
    const services=[{name:'Zabbix',connected:eq.is_active&&Math.random()>0.3},{name:'NTP',connected:Math.random()>0.2},{name:'Graylog',connected:eq.is_active&&Math.random()>0.4},{name:'RADIUS',connected:Math.random()>0.5},{name:'TACACS+',connected:Math.random()>0.6}];
    const sfpH=mods.sfp.map(m=>`<div class="module-tile"><div class="module-name">🔌 ${m.name}</div><div class="module-details"><span>${m.type}</span><span>${m.serial}</span><span>${m.wavelength}</span><span>${m.distance}</span></div></div>`).join('');
    const psuH=mods.psu.map(m=>`<div class="module-tile"><div class="module-name">⚡ ${m.name}</div><div class="module-details"><span>${m.type}</span><span>${m.serial}</span><span>${m.status==='OK'?'✅':'⚠️'} ${m.status}</span></div></div>`).join('');
    const srvH=services.map(s=>`<div class="service-card"><div class="service-name">${s.name}</div><div class="service-status ${s.connected?'service-connected':'service-disconnected'}">${s.connected?'✓ Подключён':'✗ Не подключён'}</div></div>`).join('');
    const ov=document.getElementById('modalOverlay'),mb=document.getElementById('modalBox');mb.className='modal wide';
    mb.innerHTML=`<h3>📋 ${escapeHtml(eq.hostname)}</h3><div class="equipment-dossier">
    <div class="dossier-section"><h4>📄 Досье</h4><div class="dossier-grid">
    <div class="dossier-item"><div class="label">Хост</div><div class="value">${escapeHtml(eq.hostname)}</div></div>
    <div class="dossier-item"><div class="label">Тип</div><div class="value">${eq.type}</div></div>
    <div class="dossier-item"><div class="label">Модель</div><div class="value">${eq.model}</div></div>
    <div class="dossier-item"><div class="label">Вендор</div><div class="value">${eq.vendor}</div></div>
    <div class="dossier-item"><div class="label">Серийный</div><div class="value">${eq.serial_number||'—'}</div></div>
    <div class="dossier-item"><div class="label">MAC</div><div class="value">${eq.mac_address||'—'}</div></div>
    <div class="dossier-item"><div class="label">IP</div><div class="value">${eq.ip_address||'—'}</div></div>
    <div class="dossier-item"><div class="label">Прошивка</div><div class="value">${eq.firmware||'—'}</div></div>
    <div class="dossier-item"><div class="label">Узел</div><div class="value">${node?node.name:'Склад'}</div></div>
    <div class="dossier-item"><div class="label">Шкаф/Юнит</div><div class="value">${eq.cabinet} / ${eq.unit||'—'}</div></div>
    <div class="dossier-item"><div class="label">Статус</div><div class="value">${eq.is_active?'<span class="status-badge status-ok">Активен</span>':'<span class="status-badge status-cancelled">Неактивен</span>'}</div></div>
    </div></div>
    <div class="dossier-section"><h4>🔧 Модули</h4><div class="modules-container"><div class="module-column"><div class="module-column-header">🔌 SFP</div><div class="module-list">${sfpH||'Нет'}<div class="add-module-tile" onclick="addModule(${eid},'sfp')">+ SFP</div></div></div><div class="module-column"><div class="module-column-header">⚡ БП</div><div class="module-list">${psuH||'Нет'}<div class="add-module-tile" onclick="addModule(${eid},'psu')">+ БП</div></div></div></div></div>
    <div class="dossier-section"><h4>🌐 Сервисы</h4><div class="services-grid">${srvH}</div></div></div>
    <div class="modal-actions"><button class="btn secondary" id="modalClose">Закрыть</button></div>`;
    document.getElementById('modalClose').addEventListener('click',()=>ov.style.display='none');ov.style.display='flex';
}
function addModule(eid,type){const mods=equipmentModules[eid]||{sfp:[],psu:[]};if(type==='sfp')mods.sfp.push({...randomItem(sfpModules)});else mods.psu.push({...randomItem(psuModules)});equipmentModules[eid]=mods;showToast('Модуль добавлен','success');showEquipmentDetails(eid);}

// ==================== ЭКСПОРТ ====================
function exportCurrentTable(){}
function debounce(fn,delay){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn.apply(this,args),delay);};}

// ==================== ПАНЕЛЬ И НАВИГАЦИЯ ====================
document.getElementById('panelTab').addEventListener('click',()=>{if(currentTab==='nodes'){panelOpen=true;updatePanelView();}});
document.getElementById('panelClose').addEventListener('click',()=>{panelOpen=false;selectedEquipmentId=null;updatePanelView();});
document.querySelectorAll('#appScreen nav.tabs button[data-tab]').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('#appScreen nav.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');expandedNodeId=null;loadedNestedData={};loadingNodeId=null;panelOpen=false;selectedEquipmentId=null;expandedStackId=null;updatePanelView();buildTab(b.dataset.tab);});});
</script>
